name: Expand H2 demo source

on:
  push:
    paths:
      - ".github/workflows/expand-demo.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Expand source and commit
        run: |
          set -e
          tar -xzf h2-card-ai-demo-source.tar.gz
          rm -f h2-card-ai-demo-source.tar.gz h2-card-ai-demo-v2.tar.gz
          rm -f .github/workflows/expand-demo.yml
          rmdir .github/workflows .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish H2 card AI demo source"
          git push
